<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Auto Apply</title>
  <style>
    body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px}
    textarea{width:100%;height:160px} button{padding:10px 18px;margin-top:8px}
    pre{background:#f4f4f4;padding:12px;overflow:auto;max-height:420px} label{display:block;margin:12px 0 4px}
  </style>
</head>
<body>
  <h1>Auto Apply</h1>
  <label>Job URLs (one per line — Workday, Greenhouse, Lever, Ashby…)</label>
  <textarea id="urls" placeholder="https://company.wd1.myworkdayjobs.com/en-US/site/job/..."></textarea>
  <label><input type="checkbox" id="headed"> Run headed (watch the browser; log in there if prompted)</label>
  <label><input type="checkbox" id="submit"> Auto-submit (default off — review first!)</label>
  <button id="go" onclick="go()">Fill applications</button>
  <pre id="out">Results will appear here…</pre>
  <script>
    async function go() {
      const out = document.getElementById('out');
      const btn = document.getElementById('go');
      const urls = document.getElementById('urls').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!urls.length) { out.textContent = 'Add at least one URL.'; return; }
      btn.disabled = true;
      out.textContent = 'Running…';
      try {
        const r = await fetch('/api/apply', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            urls,
            headed: document.getElementById('headed').checked,
            submit: document.getElementById('submit').checked,
          }),
        });
        const body = await r.json();
        out.textContent = JSON.stringify(body, null, 2);
        const results = Array.isArray(body) ? body : (body.results || []);
        if (results.some(x => x.needsLogin))
          out.textContent += '\n\n⚠️ Some URLs need login — tick "Run headed" and log in, or run: npm run login -- "<url>"';
      } catch (e) {
        out.textContent = 'Request failed: ' + e;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
